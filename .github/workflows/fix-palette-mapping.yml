name: Fix palette image mapping

on:
  push:
    paths:
      - '.github/workflows/fix-palette-mapping.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-palette:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Match each photo to the correct color
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          mapping = {
              'tone-blueberry': 'assets/E324411E-8403-4CFD-A4C8-5E064136CAC9.png',
              'tone-sky': 'assets/A11CB920-46AC-44FA-B186-A0C7F6953D73.png',
              'tone-olive': 'assets/DE646902-AA44-4BC6-8C7A-478C724CA5DE.png',
              'tone-pink': 'assets/BDC9B9F3-9452-428D-8A2C-6FA2BA3299E4.png',
              'tone-terracotta': 'assets/5A7A3DEE-AEE5-4FCA-B40A-A98DFCBA6843.png',
              'tone-burgundy': 'assets/EC7ECDB2-2974-49EC-A905-C8AB5384D95E.png',
              'tone-caramel': 'assets/35B14F9C-D545-4397-8D0D-74143B5956B6.png',
              'tone-brown': 'assets/3A3FD755-D8D0-4A31-908C-1706BB32CF52.png',
              'tone-black': 'assets/2421FB70-C756-403C-B8C9-C37C7B569B9D.png',
              'tone-milk': 'assets/BFB62279-0A0A-4FD5-AA83-B3AC581AAC86.png',
          }

          for cls, image in mapping.items():
              pattern = rf"\.{re.escape(cls)}\{{background-image:url\('[^']+'\)\}}"
              replacement = f".{cls}{{background-image:url('{image}')}}"
              text, count = re.subn(pattern, replacement, text)
              if count != 1:
                  raise SystemExit(f'Expected one CSS rule for {cls}, found {count}')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit corrected palette
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes required"
          else
            git commit -m "Исправить соответствие фотографий и цветов"
            git push
          fi
